<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEMOSA - Login & Register</title>
<style>
  :root{ --header-bg:#2b2b2b; --page-bg:#e8e8e8; --card-bg:#fff; --field-bg:#d9d9d9; --btn-bg:#1a1a1a; --btn-text:#fff; --radius:6px; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI',Arial,sans-serif;background:var(--page-bg);min-height:100vh;display:flex;flex-direction:column;align-items:center;}
  header{width:100%;background:var(--header-bg);color:#fff;padding:18px;text-align:center;}
  header h1{letter-spacing:2px;font-size:1.4rem;}
  main{width:100%;max-width:480px;background:var(--card-bg);margin:20px auto;padding:24px 20px;box-shadow:0 2px 6px rgba(0,0,0,0.15);border-radius:8px;}
  .hidden{display:none!important;}
  .tabs{display:flex;gap:8px;margin-bottom:18px;}
  .tab{flex:1;padding:12px;border:none;background:var(--field-bg);border-radius:6px;font-weight:700;cursor:pointer;}
  .tab.active{background:var(--header-bg);color:#fff;}
  form{display:flex;flex-direction:column;gap:12px;}
  .form-row{display:flex;align-items:center;gap:10px;}
  .form-row label{width:80px;font-size:0.8rem;font-weight:600;}
  .form-row input, .form-row select{flex:1;background:var(--field-bg);border:none;border-radius:6px;padding:10px 12px;font-size:0.85rem;}
  .status-box{background:var(--field-bg);border-radius:6px;min-height:36px;display:flex;align-items:center;padding:10px 12px;font-size:0.85rem;margin-top:14px;font-weight:600;}
  .status-box.error{background:#ffdddd;color:#a00;border-left:5px solid #a00;}
  .status-box.success{background:#ddffdd;color:#080;border-left:5px solid #080;}
  .btn{background:var(--btn-bg);color:var(--btn-text);border:none;border-radius:6px;padding:12px 22px;cursor:pointer;font-weight:600;}
  .btn.secondary{background:#6b6b6b;}
  .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px;}
  footer{width:100%;max-width:480px;text-align:center;font-size:0.65rem;color:#555;background:#d4d4d4;padding:10px 0 20px;margin-top:10px;}
  .hint{font-size:0.7rem;color:#666;background:#f0f0f0;padding:8px;border-radius:4px;margin-top:8px;}
</style>
</head>
<body>
<header><h1>NEMOSA Skills Tracker</h1></header>
<main>
  <div style="text-align:center;margin-bottom:14px;">
    <p style="font-weight:700;">Register First, Then Login By Role</p>
  </div>

  <div class="tabs">
    <button id="tabLogin" class="tab active" onclick="showTab('login')">Login</button>
    <button id="tabRegister" class="tab" onclick="showTab('register')">Register New User</button>
  </div>

  <form id="loginForm">
    <div class="form-row"><label>Role:</label><select id="roleSelect"><option value="learner">Learner</option><option value="assessor">Assessor</option><option value="admin">Admin</option></select></div>
    <div class="form-row"><label>Name:</label><input type="text" id="userName" placeholder="Full name as registered" required></div>
    <div class="form-row"><label>User ID:</label><input type="text" id="userId" placeholder="e.g. L123" required></div>
    <div class="actions"><button type="submit" class="btn">Login → Dashboard</button></div>
    <div class="hint">Learners must be registered first. If not registered, switch to Register tab.</div>
  </form>

  <form id="registerForm" class="hidden">
    <div class="form-row"><label>Role:</label><select id="regRole"><option value="learner">Learner</option><option value="assessor">Assessor</option><option value="admin">Admin</option></select></div>
    <div class="form-row"><label>Full Name:</label><input type="text" id="regName" placeholder="e.g. Nandi Dlamini" required></div>
    <div class="form-row"><label>User ID:</label><input type="text" id="regId" placeholder="Unique ID e.g. L001" required></div>
    <div class="form-row"><label>Email:</label><input type="email" id="regEmail" placeholder="Optional"></div>
    <div class="form-row"><label>Password:</label><input type="password" id="regPass" placeholder="Min 6 chars" minlength="6"></div>
    <div class="actions"><button type="button" class="btn secondary" onclick="showTab('login')">Back to Login</button><button type="submit" class="btn">Register → Dashboard</button></div>
  </form>

  <div class="status-box" id="status">Ready. Register first if new.</div>
</main>
<footer>All Rights Reserved NEMOSA 2026 |</footer>


<script type="module" src="firestore-config.js"></script>
<script type="module" src="auth.js"></script>
</body>
</html>
